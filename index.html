<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the app use the full screen on phones with a notch;
         the CSS adds padding (safe-area-inset) so nothing hides behind it.
         maximum-scale=1 stops the browser zooming in by itself when you tap a box.
         interactive-widget=resizes-content makes the app fit above the keyboard. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- Color of the phone's status bar / browser bar (updated when the theme changes) -->
    <meta name="theme-color" content="#ffffff" />
    <!-- "Add to Home Screen" support: opens full screen like a real app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Stitch Log" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Stitch Log</title>
    <script>
      // Set the theme before React loads so the page never flashes the wrong colors.
      (function () {
        var theme = null
        try { theme = localStorage.getItem('theme') } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#221e1c' : '#ffffff'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
